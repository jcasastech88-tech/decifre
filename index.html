<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineWick - Generador y Enlazador de Trailers V2</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --border-color: #334155;
            --success-color: #22c55e;
        }
 
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
        }

        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            color: var(--accent-color);
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        textarea {
            width: 100%;
            height: 100px;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            padding: 12px;
            font-size: 0.95rem;
            resize: vertical;
            box-sizing: border-box;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button {
            width: 100%;
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .result-box {
            margin-top: 25px;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 8px;
            display: none;
        }

        .result-box.active {
            display: block;
        }

        .result-url {
            word-break: break-all;
            font-family: monospace;
            color: var(--success-color);
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 4px;
            margin-bottom: 10px;
            background-color: rgba(56, 189, 248, 0.2);
            color: var(--accent-color);
        }

        .copy-btn {
            background-color: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 8px;
            font-size: 0.85rem;
            margin-top: 5px;
            width: 100%;
        }

        .copy-btn:hover {
            background-color: rgba(56, 189, 248, 0.1);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>CineWick Link Tokenizer V2</h1>
        
        <div class="form-group">
            <label for="urlInput">Pegá tu URL original de IMDb:</label>
            <textarea id="urlInput" placeholder="https://imdb-video.media-imdb.com/..."></textarea>
        </div>

        <button onclick="generarEnlaceProxy()">Generar Enlace Inteligente</button>

        <div id="resultBox" class="result-box">
            <div class="badge">Enlace Automatizado por Cloudflare</div>
            <div id="resultUrl" class="result-url"></div>
            <button class="copy-btn" onclick="copiarAlPortapapeles()">Copiar Enlace</button>
        </div>
    </div>

    <script>
        function generarEnlaceProxy() {
            const rawUrl = document.getElementById('urlInput').value.trim();
            const resultBox = document.getElementById('resultBox');
            const resultUrlDiv = document.getElementById('resultUrl');

            if (!rawUrl) {
                alert("Por favor, ingresá una URL válida.");
                return;
            }

            // CAMBIÁ ESTA URL por la de tu Cloudflare Worker real
            const workerDomain = "https://round-credit-a2dc.911cristianhernan.workers.dev"; 

            // Construimos el enlace final apuntando al Worker con el parámetro ?url=
            const enlaceInteligente = `${workerDomain}/?url=${encodeURIComponent(rawUrl)}`;

            resultUrlDiv.innerText = enlaceInteligente;
            resultBox.classList.add('active');
        }

        function copiarAlPortapapeles() {
            const textToCopy = document.getElementById('resultUrl').innerText;
            navigator.clipboard.writeText(textToCopy).then(() => {
                alert("¡Enlace copiado al portapapeles!");
            });
        }
    </script>

</body>
</html>
