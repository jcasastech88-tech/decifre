<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Desencriptando enlace seguro...</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script disable-devtool-auto src='https://cdn.jsdelivr.net/npm/disable-devtool'></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .box { text-align: center; background: #1e1e1e; padding: 40px; border-radius: 12px; max-width: 400px; width: 100%; border-top: 4px solid #ff4757; }
        .spinner { border: 4px solid #333; border-top: 4px solid #ff4757; border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #error { color: #ff4757; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

<div class="box">
    <div class="spinner"></div>
    <h2>Criptoanálisis en curso...</h2>
    <p>Desencriptando destino mediante protocolo AES-256.</p>
    <div id="error"></div>
</div>

<script>
// DEBE SER LA MISMA CLAVE QUE EN EL GENERADOR
const CLAVE_SECRETA = "MiCodigoSuperSecreto2026";

window.onload = function() {
    // Captura el parámetro de la URL
    const encryptedParam = window.location.search.substring(1);
    
    if (!encryptedParam) {
        document.getElementById('error').innerText = "Error: Falta el token de seguridad.";
        return;
    }
    
    try {
        // Decodificamos el formato URL
        const encryptedData = decodeURIComponent(encryptedParam);
        
        // Desencriptamos con la clave maestra AES
        const bytes = CryptoJS.AES.decrypt(encryptedData, CLAVE_SECRETA);
        const originalUrl = bytes.toString(CryptoJS.enc.Utf8);
        
        if (originalUrl && originalUrl.startsWith('http')) {
            // Redirección express si todo es correcto
            setTimeout(() => {
                window.location.href = originalUrl;
            }, 1200);
        } else {
            document.getElementById('error').innerText = "Fallo de autenticación: Token corrupto o alterado.";
        }
        
    } catch (e) {
        document.getElementById('error').innerText = "Error crítico al procesar el algoritmo AES.";
    }
}
</script>

</body>
</html>
